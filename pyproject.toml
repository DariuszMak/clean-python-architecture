[project]
name = "eda-template-python"
version = "0.1.0"
description = "EDA template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-icdiff>=0.9",
    "redis>=7.4.0",
    "requests>=2.33.1",
    "tenacity>=9.1.4",
]
